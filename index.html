
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecondChance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7f5;
            margin: 0;
        }

        header {
            background: #198754;
            color: white;
            padding: 20px;
        }

        main {
            padding: 100px 20px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 20px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h2>SecondChance</h2>
    </header>

    <main>
        <h1>Welcome to SecondChance</h1>
        <p>Give your unused items a second chance.
        Share, reuse, and help the environment.</p>
        <button onclick="location.href='#about'">Get Started</button>

        <section id="about">
            <h2>About SecondChance</h2>
            <p>Find free items and share things you no longer need.</p>
        </section>
    </main>
</body>
</html>
