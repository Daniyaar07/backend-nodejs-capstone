name: CICD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check authRoutes.js
          node --check searchRoutes.js
          node --check secondChanceItemsRoutes.js
          node --check index.js

      - name: CI completed
        run: echo "CI/CD workflow completed successfully"
